name: smoke
# Builds the LookPress image and runs it on SQLite, MySQL 8 and PostgreSQL 16 on every push /
# PR: setup, the end-to-end smoke suite (public, multilingual, SEO, commerce, admin/RBAC,
# search), the search-matching test, then a restart and a setup that stopped half way — after
# each the smoke suite must pass again.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [ sqlite, mysql, postgres ]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_USER: lp
          MYSQL_PASSWORD: lp-ci
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot-ci"
          --health-interval=5s --health-timeout=5s --health-retries=40
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lp
          POSTGRES_PASSWORD: lp-ci
          POSTGRES_DB: cms
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U lp"
          --health-interval=5s --health-timeout=5s --health-retries=40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the database
        run: |
          case "${{ matrix.db }}" in
            sqlite)   echo "DSN=sqlite:///data/cms.db" >> "$GITHUB_ENV" ;;
            mysql)    echo "DSN=mysql://lp:lp-ci@127.0.0.1:3306/cms" >> "$GITHUB_ENV" ;;
            postgres) echo "DSN=postgres://lp:lp-ci@127.0.0.1:5432/cms" >> "$GITHUB_ENV" ;;
          esac

      # The harder case on purpose: a database whose default character set is latin1 (MySQL 5.7,
      # MariaDB and many hosting panels). LookPress must state utf8mb4 on its own tables.
      - name: MySQL database with a latin1 default
        if: matrix.db == 'mysql'
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot-ci \
            -e "CREATE DATABASE cms CHARACTER SET latin1; GRANT ALL ON cms.* TO 'lp'@'%';"

      - name: Build the image
        run: docker build -t lookpress:ci .

      - name: Start LookPress (setup runs in the entrypoint)
        run: |
          docker run -d --name lp --network host \
            -e DB_DSN="$DSN" -e ADMIN_PASSWORD=lookpress-dev -e LOOKPRESS_SEED=1 \
            -e LOOK_SECRET=ci-only-secret-0123456789abcdef0123456789 \
            -e LOOK_SESSION_SECURE=0 lookpress:ci
          bash test/ci_wait.sh http://localhost:7400 lp

      - name: Smoke suite
        run: bash test/smoke.sh http://localhost:7400

      # CSRF in a signed cookie: visitors who never log in store nothing on the server (the token
      # in the session made every form visit a session file); forged requests are refused.
      - name: CSRF without server-side state
        run: bash test/csrf_test.sh http://localhost:7400 lp

      - name: Changing LOOK_SECRET keeps open forms working (LOOK_SECRET_PREVIOUS)
        run: bash test/csrf_rotation_test.sh lookpress:ci

      - name: Every route runs on the VM (no interpreter fallback)
        run: bash test/vm_check.sh lp

      - name: Search matching (folding + LIKE escaping on this database)
        run: docker exec lp lk search_db_test.lk

      - name: Restart (every setup step runs again) + smoke suite
        run: |
          docker restart lp
          bash test/ci_wait.sh http://localhost:7400 lp
          bash test/smoke.sh http://localhost:7400

      - name: Setup that stopped half way, run again + smoke suite
        run: |
          docker exec lp lk test/forget_migrations.lk
          docker restart lp
          bash test/ci_wait.sh http://localhost:7400 lp
          bash test/smoke.sh http://localhost:7400

      - name: Logs on failure
        if: failure()
        run: docker logs lp
