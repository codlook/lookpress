# LookPress dev environment — `docker compose up` brings up a working LookPress.
# Pure LOOK: one app service on the LOOK runtime, SQLite by default (no DB server
# needed for dev). Swap DB_DSN to mysql://… / postgres://… when you add a db service.
services:
  lookpress:
    build: .
    image: lookpress:dev
    container_name: lookpress
    ports:
      - "8080:7400"          # http://localhost:8080
    volumes:
      - lp_data:/data        # SQLite db (persisted)
      - lp_uploads:/app/uploads
    environment:
      - DB_DSN=sqlite:///data/cms.db
      - LOOK_SESSION_SECURE=0 # plain-HTTP dev; set 1 (or use a TLS proxy) in prod
      - LOOKPRESS_SEED=1       # seed demo content on first run
      # Demo preset: kurumsal (default) | haber | eticaret — see docs/presets.md.
      # Overridable from the shell: LOOKPRESS_PRESET=haber docker compose up (fresh volume).
      - LOOKPRESS_PRESET=${LOOKPRESS_PRESET:-kurumsal}
      # Admin password. Explicit dev value here (NOT a hidden code default) —
      # override it: copy .env.example to .env and set ADMIN_PASSWORD, or export it.
      # Unset => /admin login is disabled (fail-loud), never a "changeme" backdoor.
      # No default: compose refuses to start until a password is chosen, so an instance
      # can never go live with a well-known admin password.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set. Copy .env.example to .env and choose a password}
      # Signs the CSRF cookie: at least 32 characters, the same on every server. No default.
      - LOOK_SECRET=${LOOK_SECRET:?LOOK_SECRET is not set. Copy .env.example to .env and set it (openssl rand -hex 32)}
      - LOOK_SECRET_PREVIOUS=${LOOK_SECRET_PREVIOUS:-}
    restart: unless-stopped

volumes:
  lp_data:
  lp_uploads:
