<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LookPress Admin</title>
<style>
 :root{--fg:#1e2230;--muted:#6b7280;--accent:#3b5bdb;--line:#e3e6ee;--bg:#f4f6fb;--panel:#fff;--danger:#c0392b}
 *{box-sizing:border-box}
 body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg);line-height:1.55}
 .abar{background:#1b1f2b;color:#fff;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
 .abar .brand{font-weight:700;color:#fff;font-size:16px;margin-right:auto;letter-spacing:-.01em}
 .abar a{color:#c7ccdb;text-decoration:none;font-size:14px}
 .abar a:hover{color:#fff}
 main{max-width:900px;margin:0 auto;padding:26px 20px}
 a{color:var(--accent)}
 h2{font-size:22px;margin:.1em 0 .5em}
 h3{font-size:16px;margin:1.4em 0 .4em}
 .muted{color:var(--muted)}
 .error{color:var(--danger)}
 table{width:100%;border-collapse:collapse;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
 td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
 thead th{background:#eef1f8;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
 tr:last-child td{border-bottom:none}
 label{display:block;margin:12px 0;font-size:14px}
 input,textarea,select{width:100%;padding:9px 10px;border:1px solid #cbd2e0;border-radius:6px;font:inherit;background:#fff;margin-top:4px}
 textarea{resize:vertical}
 button{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit}
 button:hover{filter:brightness(1.05)}
 button.del{background:var(--danger);padding:5px 10px;font-size:13px}
 .btn{display:inline-block;background:var(--accent);color:#fff;padding:5px 13px;border-radius:6px;text-decoration:none;font-size:14px}
 form.inline{display:inline;margin:0}
 ul.pages{list-style:none;padding:0}
 ul.pages li{padding:9px 0;border-bottom:1px solid var(--line)}
 .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
 .section-head h2{margin:0}
 .section-head .more{font-size:13px}
 .badge{background:var(--accent);color:#fff;font-size:11px;padding:1px 8px;border-radius:10px;vertical-align:middle}
 .status-form,.settings-form,.user-form,.contact-form{max-width:520px}
 .status-form{display:flex;gap:10px;align-items:flex-end}
 .status-form select{width:auto;min-width:150px}
 .ship-box{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.7}
 .ship-addr{color:var(--muted);white-space:pre-wrap}
 .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:20px}
 .media-item{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
 .media-item img{display:block;width:100%;height:130px;object-fit:cover;background:#eef1f8}
 .media-item figcaption{padding:8px;font-size:12px}
 .media-item code{display:block;background:#eef1f8;padding:4px 6px;border-radius:4px;margin:6px 0;word-break:break-all;font-size:11px;user-select:all}
</style></head>
<body>
<header class="abar"><span class="brand">LookPress Admin</span><a href="/admin">Panel</a><a href="/" target="_blank">Siteyi gör &rarr;</a></header>
<main>{#block "content"}{/block}</main>
</body></html>
