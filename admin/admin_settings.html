{#extends "admin/layout"}
{#block "content"}
<div class="section-head"><h2>Ayarlar</h2><a class="more" href="/admin">&larr; Admin</a></div>
<form method="post" action="/admin/settings" class="settings-form">
  <label>Site başlığı <input type="text" name="site_title" value="{$s_title}"></label>
  <label>Slogan <input type="text" name="tagline" value="{$s_tagline}"></label>
  <label>Para birimi <input type="text" name="currency" value="{$s_currency}"></label>
  <label>Tema <select name="theme">{!$theme_options}</select></label>
  <button type="submit">Kaydet</button>
</form>
{/block}
