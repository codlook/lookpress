<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{$page_title}</title>
{!$head_extra}
<style>
 /* ── Renk sistemi: skin'ler CSS değişkenlerini ezer ── */
 :root{
   --fg:#1a1a1e;--muted:#6b7280;--accent:#2d6cdf;--accent-fg:#fff;
   --line:#e7e8ec;--bg:#fbfbfd;--surface:#fff;--surface-2:#f4f5f7;
   --price:#0d7d63;--danger:#c0392b;--ok-bg:#e6f5ee;--ok-fg:#0a6b53;
   --shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.06);
   --shadow-sm:0 1px 2px rgba(17,24,39,.06);
   --radius:12px;--radius-sm:8px;--radius-pill:999px;
   --maxw:768px;--gutter:20px;
   --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif
 }
 [data-theme="ocean"]{--fg:#0f2f2c;--muted:#5a7d78;--accent:#0d9488;--line:#d6e6e3;--bg:#f2faf9;--surface:#fff;--surface-2:#e9f5f3;--price:#0b7a63}
 [data-theme="sunset"]{--fg:#2a1a12;--muted:#8a6a58;--accent:#ea580c;--line:#f0e0d5;--bg:#fffaf6;--surface:#fff;--surface-2:#fbf0e8;--price:#c2410c}
 [data-theme="dark"]{--fg:#e7e8ec;--muted:#9aa0ab;--accent:#5b9bff;--accent-fg:#0b1220;--line:#2a2e37;--bg:#101218;--surface:#181b22;--surface-2:#1f232c;--price:#34d399;--ok-bg:#123027;--ok-fg:#6ee7b7;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.3)}

 *{box-sizing:border-box}
 html{-webkit-text-size-adjust:100%}
 body{font-family:var(--font);margin:0;color:var(--fg);background:var(--bg);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-wrap:break-word}
 img{max-width:100%}
 a{color:var(--accent);text-decoration:none}
 a:hover{text-decoration:underline}

 /* ── Header ── */
 .site-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
 .header-inner{max-width:1080px;margin:0 auto;padding:12px var(--gutter);display:flex;align-items:center;gap:16px}
 .brand{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;flex:0 0 auto}
 .brand a{color:var(--fg)}
 .brand a:hover{text-decoration:none;color:var(--accent)}
 .nav-toggle-cb{position:absolute;opacity:0;pointer-events:none}
 .nav-toggle{display:none;margin-left:auto;flex:0 0 auto;width:42px;height:42px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;align-items:center;justify-content:center;color:var(--fg)}
 .nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{content:"";display:block;width:20px;height:2px;background:currentColor;border-radius:2px;transition:transform .2s,opacity .2s}
 .nav-toggle span{position:relative}
 .nav-toggle span::before{position:absolute;top:-6px}
 .nav-toggle span::after{position:absolute;top:6px}
 .nav-wrap{margin-left:auto;display:flex;align-items:center;gap:16px;flex:1 1 auto;justify-content:flex-end}
 .site-nav{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
 .site-nav a{color:var(--fg);font-size:14px;font-weight:500;padding:7px 12px;border-radius:var(--radius-pill);line-height:1}
 .site-nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--accent)}
 .site-nav .nav-cart{color:var(--accent-fg);background:var(--accent)}
 .site-nav .nav-cart:hover{background:var(--accent);color:var(--accent-fg);filter:brightness(1.06)}
 .langsw{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:4px}
 .langsw a{color:var(--muted);padding:2px 4px}
 .langsw a:hover{color:var(--accent)}
 .nav-search{flex:0 1 240px;min-width:140px}
 .nav-search input{width:100%;padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius-pill);font:inherit;font-size:14px;background:var(--surface);color:var(--fg)}
 .nav-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}

 /* ── Layout ── */
 main{max-width:var(--maxw);margin:0 auto;padding:32px var(--gutter) 48px;min-height:60vh}

 /* ── Tipografi ── */
 h1,h2,h3,h4{line-height:1.25;letter-spacing:-.015em;font-weight:700}
 h2{font-size:26px;margin:0 0 .6em}
 h3{font-size:20px;margin:1.4em 0 .5em}
 .muted{color:var(--muted)}
 .error{color:var(--danger)}

 /* ── İçerik (page.html makale gövdesi) ── */
 .prose{font-size:17px}
 .prose>*:first-child{margin-top:0}
 .prose p{margin:0 0 1.1em}
 .prose h2{font-size:24px;margin:1.6em 0 .5em}
 .prose h3{font-size:20px}
 .prose ul,.prose ol{margin:0 0 1.1em;padding-left:1.4em}
 .prose li{margin:.35em 0}
 .prose img{border-radius:var(--radius);border:1px solid var(--line);margin:1.2em 0;display:block}
 .prose a{text-decoration:underline;text-underline-offset:2px}
 .prose blockquote{margin:1.4em 0;padding:.4em 1.1em;border-left:3px solid var(--accent);color:var(--muted);font-style:italic}
 .prose code{background:var(--surface-2);padding:.15em .4em;border-radius:5px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .prose pre{background:var(--surface-2);padding:14px 16px;border-radius:var(--radius-sm);overflow:auto;border:1px solid var(--line)}
 .prose pre code{background:none;padding:0}
 .prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
 .prose table{width:100%;border-collapse:collapse;margin:1.2em 0}

 /* ── Tablolar ── */
 table{width:100%;border-collapse:collapse;margin-top:8px}
 td,th{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
 th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}

 /* ── Formlar ── */
 label{display:block;margin:14px 0;font-size:14px;font-weight:500}
 input,textarea,select{width:100%;padding:11px 13px;margin-top:6px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:15px;background:var(--surface);color:var(--fg);transition:border-color .15s,box-shadow .15s}
 input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
 textarea{resize:vertical;min-height:110px}
 button{background:var(--accent);color:var(--accent-fg);border:0;padding:11px 20px;border-radius:var(--radius-sm);cursor:pointer;font:inherit;font-size:15px;font-weight:600;line-height:1.2;transition:filter .15s,transform .05s}
 button:hover{filter:brightness(1.07)}
 button:active{transform:translateY(1px)}
 button.del{background:var(--danger)}
 .btn{display:inline-block;background:var(--accent);color:var(--accent-fg);padding:9px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600}
 .btn:hover{text-decoration:none;filter:brightness(1.07)}
 form.inline{display:inline;margin:0}

 /* ── Liste / pages ── */
 ul.pages{list-style:none;padding:0;margin:8px 0}
 ul.pages li{padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
 ul.pages li a{color:var(--fg);font-weight:500}
 ul.pages li a:hover{color:var(--accent);text-decoration:none}
 .pager{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:28px}
 .pager a{text-decoration:none;padding:9px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--fg)}
 .pager a:hover{border-color:var(--accent);color:var(--accent)}

 /* ── Medya grid (admin/medya) ── */
 .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:20px}
 .media-item{margin:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
 .media-item img{display:block;width:100%;height:130px;object-fit:cover;background:var(--surface-2)}
 .media-item figcaption{padding:9px 10px;font-size:12px}
 .media-item code{display:block;background:var(--surface-2);padding:5px 7px;border-radius:5px;margin:6px 0;word-break:break-all;font-size:11px;user-select:all}

 /* ── İçerik alanları (page.html) ── */
 .cf{margin:0 0 22px}
 .cf-image{display:block;max-width:100%;border-radius:var(--radius);border:1px solid var(--line);margin:0 0 16px}
 .cf-price{font-size:30px;font-weight:800;color:var(--price);margin:0 0 12px;letter-spacing:-.02em}
 .cf-row{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
 .cf-label{display:inline-block;min-width:110px;color:var(--muted);text-transform:capitalize;font-weight:500}

 /* ── Kart grid (list.html) ── */
 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin-top:20px}
 .card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .18s,border-color .18s}
 .card:hover{box-shadow:var(--shadow);transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));text-decoration:none}
 .card-img img{display:block;width:100%;height:170px;object-fit:cover;background:var(--surface-2)}
 .card-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
 .card-title{font-weight:600;font-size:15.5px;line-height:1.35}
 .card-price{color:var(--price);font-weight:800;font-size:16px}

 /* ── Hero (home.html) ── */
 .hero{padding:36px 0 12px}
 .hero h1{margin:0 0 .3em;font-size:clamp(30px,6vw,42px);letter-spacing:-.03em;line-height:1.1}
 .hero p{color:var(--muted);font-size:clamp(16px,2.5vw,19px);max-width:56ch;margin:0}
 .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:40px;padding-bottom:8px;border-bottom:1px solid var(--line)}
 .section-head h2{margin:0}
 .section-head .more{font-size:14px;font-weight:600;white-space:nowrap}

 /* ── Sepet / checkout ── */
 .add-cart{margin-top:20px}
 .add-cart button{padding:13px 26px;font-size:16px}
 .cart-total{font-size:20px;font-weight:700;margin-top:20px}
 .checkout-ok{text-align:center;padding:48px 0}
 .checkout-ok h2{color:var(--price)}
 .checkout-form{display:flex;gap:10px;align-items:center;margin-top:14px;max-width:440px}
 .checkout-form input{flex:1;margin-top:0}
 .checkout-fields{display:flex;flex-direction:column;gap:12px;max-width:480px;margin-top:16px}
 .status-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:16px 0}
 .status-form select{width:auto;min-width:160px;margin-top:0}
 .status-form button{white-space:nowrap}
 .coupon-form{display:flex;gap:10px;max-width:440px;margin:16px 0}
 .coupon-form input{flex:1;margin-top:0}
 .qty-form{display:flex;gap:6px;align-items:center;margin:0}
 .qty-input{width:70px;padding:8px 10px;margin-top:0;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit}
 .qty-form button{padding:8px 12px;font-size:14px}
 .ship-box{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:14px 0;font-size:14px;line-height:1.8;background:var(--surface)}
 .ship-addr{color:var(--muted);white-space:pre-wrap}

 /* ── Arama ── */
 .search-page{display:flex;gap:10px;margin:16px 0 8px;max-width:520px}
 .search-page input{flex:1;margin-top:0}
 .search-page button{white-space:nowrap}

 /* ── İletişim / form ── */
 .contact-form{max-width:560px}
 .contact-form button{margin-top:10px}
 .sent-ok{background:var(--ok-bg);color:var(--ok-fg);padding:14px 18px;border-radius:var(--radius-sm);margin:16px 0;font-weight:500}

 /* ── Muhtelif ── */
 .badge{background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;padding:2px 9px;border-radius:var(--radius-pill);vertical-align:middle}
 .cat-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 22px}
 .cat-chips .chip{display:inline-block;padding:7px 15px;border:1px solid var(--line);border-radius:var(--radius-pill);font-size:14px;font-weight:500;text-decoration:none;color:var(--fg);background:var(--surface);transition:border-color .15s,color .15s}
 .cat-chips .chip:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
 .cat-chips .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
 .hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}

 /* ── Footer ── */
 .site-footer{border-top:1px solid var(--line);background:var(--surface);margin-top:40px}
 .footer-inner{max-width:1080px;margin:0 auto;padding:28px var(--gutter);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
 .footer-inner a{color:var(--muted)}
 .footer-inner a:hover{color:var(--accent)}

 /* ── Responsive: mobil menü ── */
 @media(max-width:720px){
   .nav-toggle{display:flex}
   .nav-wrap{order:3;flex-basis:100%;margin-left:0;flex-direction:column;align-items:stretch;gap:12px;justify-content:flex-start;
     max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease;padding:0}
   .nav-toggle-cb:checked~.nav-wrap{max-height:520px;opacity:1;padding:8px 0 4px}
   .site-nav{flex-direction:column;align-items:stretch;gap:2px}
   .site-nav a{padding:11px 12px;border-radius:var(--radius-sm)}
   .nav-search{flex-basis:auto;width:100%;order:-1}
   .langsw{margin:6px 0 0}
 }
 @media(max-width:400px){
   :root{--gutter:16px}
   main{padding-top:24px}
   .cards{grid-template-columns:1fr 1fr;gap:12px}
   .card-img img{height:130px}
 }
 @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body data-theme="{$skin}">
<header class="site-header">
 <div class="header-inner">
  <h1 class="brand"><a href="/">{$site_title}</a></h1>
  <input type="checkbox" id="nav-toggle-cb" class="nav-toggle-cb">
  <label for="nav-toggle-cb" class="nav-toggle" aria-label="Menü"><span></span></label>
  <div class="nav-wrap">
   <form method="get" action="/search" class="nav-search"><input type="search" name="q" placeholder="Ara…" aria-label="Ara"></form>
   <nav class="site-nav">{#each $nav_items as $m}<a href="{$m.url}">{$m.label}</a>{/each}<a class="nav-cart" href="/cart">Sepet</a><a href="/admin">Admin</a><span class="langsw"><a href="/">TR</a>/<a href="/en">EN</a></span></nav>
  </div>
 </div>
</header>
<main>{#block "content"}{/block}</main>
<footer class="site-footer">
 <div class="footer-inner">
  <span>&copy; {$site_title}</span>
  <span>LookPress ile geliştirildi &middot; <a href="/admin">Admin</a></span>
 </div>
</footer>
</body></html>
