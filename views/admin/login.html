{#extends "views/admin/auth"}
{#block "content"}
{#if $error}<p class="error">{$error}</p>{/if}
<form method="post" action="/admin/login">
<input type="hidden" name="_csrf" value="{$csrf_token}">
<label>Kullanıcı adı <input type="text" name="username" autofocus autocomplete="username"></label>
<label>Şifre <input type="password" name="password" autocomplete="current-password"></label>
<button type="submit">Giriş</button>
</form>
{/block}
