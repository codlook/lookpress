<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LookPress Admin</title>
<style>
 :root{
  --accent:#2563eb;--accent-d:#1d4ed8;
  --fg:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--panel:#fff;
  --danger:#dc2626;--ok:#16a34a;--warn:#d97706;
  --side:#0f172a;--side-2:#1e293b;--side-fg:#94a3b8;--side-hl:#e2e8f0;
  --sw:236px;--tb:56px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);
 }
 *{box-sizing:border-box}
 html,body{margin:0}
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg);line-height:1.55;-webkit-text-size-adjust:100%}
 a{color:var(--accent);text-decoration:none}
 a:hover{text-decoration:underline}

 /* ---- shell ---- */
 .layout{display:flex;min-height:100vh}
 .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sw);background:var(--side);color:var(--side-fg);
   display:flex;flex-direction:column;z-index:40;transition:transform .22s ease}
 .sidebar .logo{display:flex;align-items:center;gap:10px;padding:0 20px;height:var(--tb);flex-shrink:0;
   color:#fff;font-weight:700;letter-spacing:-.01em;font-size:16px;border-bottom:1px solid rgba(255,255,255,.07)}
 .sidebar .logo .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-flex;
   align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
 .snav{flex:1;overflow-y:auto;padding:12px 12px 20px}
 .snav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;padding:14px 10px 6px}
 .snav a{display:flex;align-items:center;gap:11px;color:var(--side-fg);padding:9px 11px;border-radius:8px;
   font-size:14px;margin-bottom:2px}
 .snav a:hover{background:var(--side-2);color:var(--side-hl);text-decoration:none}
 .snav a.active{background:var(--accent);color:#fff}
 .snav a .ic{width:18px;text-align:center;font-size:15px;flex-shrink:0}
 .sfoot{padding:12px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
 .sfoot .who{font-size:12px;color:#64748b;padding:2px 11px 8px}
 .sfoot .who b{color:#cbd5e1}
 .sfoot a.out{display:block;color:#94a3b8;padding:8px 11px;border-radius:8px;font-size:13px}
 .sfoot a.out:hover{background:var(--side-2);color:#fff;text-decoration:none}

 .content{flex:1;min-width:0;margin-left:var(--sw);display:flex;flex-direction:column}
 .topbar{position:sticky;top:0;z-index:30;height:var(--tb);background:var(--panel);border-bottom:1px solid var(--line);
   display:flex;align-items:center;gap:12px;padding:0 20px}
 .topbar .burger{display:none;background:none;border:0;padding:6px;cursor:pointer;color:var(--fg);font-size:22px;line-height:1;border-radius:8px}
 .topbar .burger:hover{background:var(--bg)}
 .topbar .ttl{font-weight:600;font-size:15px}
 .topbar .spacer{margin-left:auto}
 .topbar .view-site{font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
 .topbar .view-site:hover{color:var(--accent)}
 main{padding:24px 22px;max-width:1080px;width:100%;margin:0 auto}

 /* backdrop for mobile off-canvas */
 .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:35;opacity:0;visibility:hidden;transition:opacity .2s}
 body.nav-open .backdrop{opacity:1;visibility:visible}

 /* ---- typography ---- */
 h2{font-size:22px;margin:.1em 0 .6em;letter-spacing:-.01em}
 h3{font-size:16px;margin:1.5em 0 .5em}
 .muted{color:var(--muted)}
 .error{color:var(--danger)}
 .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
 .section-head h2{margin:0}
 .section-head .more{font-size:13px}

 /* ---- tables ---- */
 .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow)}
 table{width:100%;border-collapse:collapse;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
 .table-wrap>table{margin-top:0;border:0;border-radius:0;box-shadow:none;min-width:520px}
 td,th{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
 thead th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
 tbody tr:last-child td{border-bottom:none}
 tbody tr:hover{background:#f8fafc}

 /* ---- forms ---- */
 label{display:block;margin:14px 0;font-size:14px;font-weight:500}
 input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff;margin-top:5px;color:var(--fg)}
 input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
 textarea{resize:vertical}
 button{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500;transition:background .15s}
 button:hover{background:var(--accent-d)}
 button.del{background:var(--danger);padding:6px 12px;font-size:13px}
 button.del:hover{background:#b91c1c}
 .btn{display:inline-block;background:var(--accent);color:#fff;padding:8px 15px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500}
 .btn:hover{background:var(--accent-d);text-decoration:none}
 .btn-sm{padding:6px 11px;font-size:13px;border-radius:7px}
 form.inline{display:inline;margin:0}
 form.urow{display:inline-flex;gap:6px;align-items:center;margin:2px 6px 2px 0}
 form.urow select,form.urow input{margin-top:0;padding:6px 9px}
 .status-form,.settings-form,.user-form,.contact-form{max-width:560px}
 .status-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
 .status-form label{margin:0}
 .status-form select{width:auto;min-width:160px}

 /* ---- lists / cards ---- */
 ul.pages{list-style:none;padding:0;margin:8px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
 ul.pages li{padding:12px 16px;border-bottom:1px solid var(--line)}
 ul.pages li:last-child{border-bottom:none}
 .badge{display:inline-block;background:#dbeafe;color:#1e40af;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;vertical-align:middle}
 .ship-box{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;margin:12px 0;font-size:14px;line-height:1.7;box-shadow:var(--shadow)}
 .ship-addr{color:var(--muted);white-space:pre-wrap}

 .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-top:18px}
 .media-item{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
 .media-item img{display:block;width:100%;height:130px;object-fit:cover;background:#eef1f8}
 .media-item figcaption{padding:9px;font-size:12px}
 .media-item code{display:block;background:#f1f5f9;padding:5px 7px;border-radius:6px;margin:6px 0;word-break:break-all;font-size:11px;user-select:all}

 .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}
 .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
 .stat-n{font-size:26px;font-weight:700;letter-spacing:-.02em}
 .stat-l{color:var(--muted);font-size:13px;margin-top:5px}
 .quicklinks{margin:16px 0;font-size:14px;display:flex;flex-wrap:wrap;gap:10px 6px;align-items:center}

 /* ---- responsive ---- */
 @media(max-width:860px){
  .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav-open .sidebar{transform:translateX(0)}
  .content{margin-left:0}
  .topbar .burger{display:inline-flex}
  main{padding:18px 16px}
  /* any bare table scrolls horizontally instead of squishing */
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
 }
 @media(max-width:480px){
  main{padding:16px 14px}
  h2{font-size:20px}
  .stat-row{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .stat{padding:15px}
  .stat-n{font-size:23px}
  .status-form{align-items:stretch}
  .status-form select,.status-form button{width:100%}
  .topbar{padding:0 14px}
 }

 /* ---- media field (image picker) ---- */
 .media-field{margin-top:5px}
 .mf-prev{margin-bottom:8px}
 .mf-prev img.mf-preview{max-width:180px;max-height:140px;border:1px solid var(--line);border-radius:8px;display:block;object-fit:cover;background:#f1f5f9}
 .mf-row{display:flex;gap:8px;align-items:center}
 .mf-row .mf-url{flex:1;margin-top:0}
 .mf-pick{white-space:nowrap}

 /* ---- media picker modal ---- */
 .mp-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
 .mp-modal.open{display:flex}
 .mp-modal .mp-back{position:absolute;inset:0;background:rgba(15,23,42,.5)}
 .mp-box{position:relative;background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:760px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
 .mp-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
 .mp-head h3{margin:0;font-size:16px}
 .mp-head .spacer{margin-left:auto}
 .mp-close{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
 .mp-close:hover{background:var(--bg)}
 .mp-up{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
 .mp-body{padding:16px 18px;overflow-y:auto}
 .mp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
 .mp-item{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;transition:box-shadow .12s,border-color .12s}
 .mp-item:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(37,99,235,.18)}
 .mp-item img{display:block;width:100%;height:96px;object-fit:cover;background:#eef1f8}
 .mp-item span{display:block;padding:6px 8px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .mp-empty{color:var(--muted);padding:24px;text-align:center}
</style></head>
<body>
<div class="layout">
 <aside class="sidebar" id="sidebar">
  <div class="logo"><span class="dot">L</span> LookPress</div>
  <nav class="snav">
   <a href="/admin" data-nav="/admin"><span class="ic">▤</span> Panel</a>
   <div class="grp">İçerik Yönetimi</div>
{!$nav_types}
   <a href="/admin/types" data-nav="/admin/types"><span class="ic">◲</span> İçerik tipleri</a>
   <a href="/admin/media" data-nav="/admin/media"><span class="ic">▣</span> Medya</a>
   <a href="/admin/forms" data-nav="/admin/forms"><span class="ic">✉</span> Form gönderimleri</a>
{!$ext_nav}
{#if $nav_super}   <div class="grp">Yönetim</div>
   <a href="/admin/users" data-nav="/admin/users"><span class="ic">◍</span> Kullanıcılar</a>
   <a href="/admin/settings" data-nav="/admin/settings"><span class="ic">⚙</span> Ayarlar</a>
{/if}  </nav>
  <div class="sfoot">
   <div class="who">Giriş: <b>{$nav_user}</b></div>
   <a class="out" href="/" target="_blank">↗ Siteyi gör</a>
   <a class="out" href="/admin/logout">⏻ Çıkış</a>
  </div>
 </aside>
 <div class="content">
  <header class="topbar">
   <button class="burger" id="burger" aria-label="Menü">☰</button>
   <span class="ttl">Yönetim Paneli</span>
   <span class="spacer"></span>
   <a class="view-site" href="/" target="_blank">↗ Siteyi gör</a>
  </header>
  <main>{#block "content"}{/block}</main>
 </div>
</div>
<div class="backdrop" id="backdrop"></div>

<!-- Media picker modal (shared by every image field) -->
<div class="mp-modal" id="mpModal">
 <div class="mp-back" data-mp-close></div>
 <div class="mp-box">
  <div class="mp-head">
   <h3>Görsel seç</h3>
   <span class="spacer"></span>
   <label class="mp-up">↑ Yükle<input type="file" id="mpUpload" accept="image/*" style="display:none"></label>
   <button class="mp-close" data-mp-close aria-label="Kapat">×</button>
  </div>
  <div class="mp-body"><div class="mp-grid" id="mpGrid"><div class="mp-empty">Yükleniyor…</div></div></div>
 </div>
</div>

<script>
(function(){
 // ---- media picker: shared modal for all image fields ----
 var modal=document.getElementById('mpModal'),grid=document.getElementById('mpGrid'),
     upload=document.getElementById('mpUpload'),target=null;
 function openModal(inp){target=inp;modal.classList.add('open');loadGrid();}
 function closeModal(){modal.classList.remove('open');target=null;}
 function pick(url){
  if(!target)return;
  target.value=url;
  var field=target.closest('.media-field'),prev=field&&field.querySelector('.mf-prev');
  if(prev)prev.innerHTML='<img src="'+url+'" alt="" class="mf-preview">';
  closeModal();
 }
 function loadGrid(){
  grid.innerHTML='<div class="mp-empty">Yükleniyor…</div>';
  fetch('/admin/media/list',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(items){
   if(!items||!items.length){grid.innerHTML='<div class="mp-empty">Arşivde görsel yok. Yukarıdan yükleyin.</div>';return;}
   grid.innerHTML='';
   items.forEach(function(it){
    var d=document.createElement('div');d.className='mp-item';
    d.innerHTML='<img src="'+it.url+'" alt=""><span>'+(it.original||it.name)+'</span>';
    d.addEventListener('click',function(){pick(it.url);});
    grid.appendChild(d);
   });
  }).catch(function(){grid.innerHTML='<div class="mp-empty">Liste yüklenemedi.</div>';});
 }
 document.addEventListener('click',function(e){
  var pk=e.target.closest('.mf-pick');
  if(pk){e.preventDefault();var f=pk.closest('.media-field');openModal(f&&f.querySelector('.mf-url'));return;}
  if(e.target.hasAttribute&&e.target.hasAttribute('data-mp-close'))closeModal();
 });
 if(upload)upload.addEventListener('change',function(){
  if(!upload.files||!upload.files[0])return;
  var fd=new FormData();fd.append('file',upload.files[0]);
  grid.innerHTML='<div class="mp-empty">Yükleniyor…</div>';
  fetch('/admin/media/upload',{method:'POST',body:fd,credentials:'same-origin'}).then(function(r){return r.json();}).then(function(res){
   upload.value='';
   if(res&&res.ok){pick(res.url);}else{grid.innerHTML='<div class="mp-empty">'+((res&&res.error)||'Yükleme başarısız')+'</div>';}
  }).catch(function(){grid.innerHTML='<div class="mp-empty">Yükleme başarısız.</div>';});
 });
 document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

 var b=document.getElementById('burger'),bd=document.getElementById('backdrop');
 function close(){document.body.classList.remove('nav-open');}
 if(b)b.addEventListener('click',function(){document.body.classList.toggle('nav-open');});
 if(bd)bd.addEventListener('click',close);
 // active nav: longest data-nav prefix match on current path
 var path=location.pathname,best=null,bl=-1;
 document.querySelectorAll('.snav a[data-nav]').forEach(function(a){
  var p=a.getAttribute('data-nav');
  var hit=(p==='/admin')?(path==='/admin'):(path===p||path.indexOf(p+'/')===0||path===p);
  if(p!=='/admin'&&path.indexOf(p)===0)hit=true;
  if(hit&&p.length>bl){best=a;bl=p.length;}
 });
 if(best)best.classList.add('active');
})();
</script>
</body></html>
