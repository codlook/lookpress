{#extends "views/admin/layout"}
{#block "content"}
<div class="section-head"><h2>Kullanıcılar <span class="muted">({$count})</span></h2></div>
<div class="table-wrap"><table>
<thead><tr><th>Kullanıcı</th><th>Rol</th><th>İşlemler</th></tr></thead>
<tbody>{!$rows}</tbody>
</table></div>

<h3>Yeni kullanıcı</h3>
<form method="post" action="/admin/users/new" class="user-form">
  <label>Kullanıcı adı <input type="text" name="username" required></label>
  <label>Şifre <input type="password" name="password" required></label>
  <label>Rol
    <select name="role"><option value="editor">editor</option><option value="admin">admin</option></select>
  </label>
  <button type="submit">Ekle</button>
</form>
<p class="muted" style="font-size:13px;margin-top:14px"><b>editor</b>: içerik, medya, formlar ve siparişleri yönetir. <b>admin</b>: ek olarak kullanıcılar, ayarlar ve kuponlar.</p>
{/block}
