{#extends "views/admin/layout"}
{#block "content"}
<h2>Posts <a class="btn" href="/admin/posts/new">+ New</a> <a class="btn" href="/admin">Pages</a></h2>
<p class="muted"><a href="/admin/logout">Log out</a></p>
<table>
<tr><th>Title</th><th>Slug</th><th>Status</th><th></th></tr>
{#each $posts as $p}
<tr>
<td><a href="/admin/posts/edit/{$p.id}">{$p.title}</a></td>
<td class="muted">/blog/{$p.slug}</td>
<td>{$p.status}</td>
<td><form class="inline" method="post" action="/admin/posts/delete/{$p.id}" onsubmit="return confirm('Delete this post?')"><button class="del" type="submit">Delete</button></form></td>
</tr>
{/each}
</table>
{/block}
