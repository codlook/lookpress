{#extends "views/admin/layout"}
{#block "content"}
<h2>{$heading}</h2>
{#each $errors as $e}<p class="error">{$e}</p>{/each}
<form method="post" action="{$action}">
<label>Slug <input name="slug" value="{$slug}" required></label>
{!$fields_html}
<details class="seo-box"><summary>SEO (opsiyonel)</summary>
<label>Meta başlık <input name="seo_title" value="{$seo_title}" placeholder="Boş bırakılırsa içerik başlığı kullanılır"></label>
<label>Meta açıklama <textarea name="seo_desc" rows="2" placeholder="Boş bırakılırsa içerikten otomatik üretilir">{$seo_desc}</textarea></label>
</details>
<label>Dil <select name="lang">
<option value="tr"{#if $lang == "tr"} selected{/if}>Türkçe</option>
<option value="en"{#if $lang == "en"} selected{/if}>English</option>
</select></label>
<label>Durum <select name="status">
<option value="draft"{#if $status == "draft"} selected{/if}>Taslak</option>
<option value="published"{#if $status == "published"} selected{/if}>Yayında</option>
</select></label>
<button type="submit">Kaydet</button>
<a class="muted" href="/admin/type/{$type.slug}" style="margin-left:12px">İptal</a>
{#if $content_id}<a class="muted" href="/admin/type/{$type.slug}/history/{$content_id}" style="margin-left:12px">Sürüm geçmişi</a>{/if}
</form>
{/block}
