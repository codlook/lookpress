<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LookPress Admin — Giriş</title>
<style>
 :root{--accent:#2563eb;--accent-d:#1d4ed8;--fg:#1e293b;--muted:#64748b;--line:#e2e8f0;--danger:#dc2626}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);line-height:1.55;
  background:linear-gradient(135deg,#0f172a,#1e293b)}
 .card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:32px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
 .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.01em;margin-bottom:4px}
 .brand .dot{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:16px}
 .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
 label{display:block;margin:14px 0;font-size:14px;font-weight:500}
 input{width:100%;padding:11px 13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin-top:5px;background:#fff}
 input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
 button{width:100%;margin-top:20px;background:var(--accent);color:#fff;border:0;padding:12px;border-radius:9px;
  cursor:pointer;font:inherit;font-weight:600;font-size:15px;transition:background .15s}
 button:hover{background:var(--accent-d)}
 .error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;padding:10px 12px;border-radius:9px;font-size:14px;margin:0 0 4px}
 .foot{text-align:center;margin-top:20px;font-size:13px}
 .foot a{color:var(--muted);text-decoration:none}
 .foot a:hover{color:var(--accent)}
</style></head>
<body>
<div class="card">
 <div class="brand"><span class="dot">L</span> LookPress</div>
 <p class="sub">Yönetim paneline giriş</p>
 {#block "content"}{/block}
 <div class="foot"><a href="/">← Siteye dön</a></div>
</div>
</body></html>
