<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{$site_title}</title>
{!$head_extra}
<style>
 :root{--fg:#1c1c1c;--muted:#666;--accent:#2d6cdf;--line:#e5e5e5;--bg:#fff}
 [data-theme="ocean"]{--fg:#12312e;--muted:#5a7d78;--accent:#0d9488;--line:#d6e6e3;--bg:#f6fbfa}
 [data-theme="sunset"]{--fg:#2a1a12;--muted:#8a6a58;--accent:#ea580c;--line:#f0e0d5;--bg:#fffaf6}
 [data-theme="dark"]{--fg:#e7e8ec;--muted:#9aa0ab;--accent:#5b9bff;--line:#2a2e37;--bg:#15171d}
 *{box-sizing:border-box}
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;color:var(--fg);background:var(--bg);line-height:1.55}
 header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
 header h1{margin:0;font-size:18px}
 header a{color:inherit;text-decoration:none}
 header nav a{color:var(--accent);font-size:14px}
 main{max-width:760px;margin:0 auto;padding:24px 20px}
 a{color:var(--accent)}
 h2{font-size:22px;margin:.2em 0 .6em}
 table{width:100%;border-collapse:collapse;margin-top:8px}
 td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
 label{display:block;margin:12px 0}
 input,textarea,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font:inherit}
 textarea{resize:vertical}
 button{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit}
 button.del{background:#c0392b;padding:5px 10px;font-size:13px}
 .btn{display:inline-block;background:var(--accent);color:#fff;padding:4px 12px;border-radius:6px;text-decoration:none;font-size:14px}
 .muted{color:var(--muted)}
 .error{color:#c0392b}
 form.inline{display:inline;margin:0}
 ul.pages{list-style:none;padding:0}
 ul.pages li{padding:8px 0;border-bottom:1px solid var(--line)}
 .pager{display:flex;gap:16px;align-items:center;margin-top:20px}
 .pager a{text-decoration:none}
 .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:20px}
 .media-item{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
 .media-item img{display:block;width:100%;height:130px;object-fit:cover;background:#f4f4f4}
 .media-item figcaption{padding:8px;font-size:12px}
 .media-item code{display:block;background:#f4f4f4;padding:4px 6px;border-radius:4px;margin:6px 0;word-break:break-all;font-size:11px;user-select:all}
 .cf{margin:0 0 18px}
 .cf-image{display:block;max-width:100%;border-radius:10px;border:1px solid var(--line);margin:0 0 14px}
 .cf-price{font-size:26px;font-weight:700;color:#0d7d63;margin:0 0 10px}
 .cf-row{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
 .cf-label{display:inline-block;min-width:90px;color:var(--muted);text-transform:capitalize}
 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin-top:18px}
 .card{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s}
 .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
 .card-img img{display:block;width:100%;height:160px;object-fit:cover;background:#f4f4f4}
 .card-body{padding:12px 14px}
 .card-title{font-weight:600;font-size:15px}
 .card-price{color:#0d7d63;font-weight:700;margin-top:6px}
 .hero{padding:26px 0 10px}
 .hero h1{margin:0;font-size:32px;letter-spacing:-.02em}
 .hero p{color:var(--muted);font-size:16px;max-width:52ch}
 .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:28px}
 .section-head h2{margin:0}
 .section-head .more{font-size:13px}
 .add-cart{margin-top:16px}
 .add-cart button{padding:11px 22px;font-size:15px}
 .cart-total{font-size:18px;margin-top:16px}
 .checkout-ok{text-align:center;padding:40px 0}
 .checkout-ok h2{color:#0d7d63}
 .checkout-form{display:flex;gap:10px;align-items:center;margin-top:12px;max-width:420px}
 .checkout-form input{flex:1}
 .status-form{display:flex;gap:10px;align-items:flex-end;margin:14px 0}
 .status-form select{width:auto;min-width:150px}
 .status-form button{white-space:nowrap}
 .nav-search{flex:1;max-width:280px;margin:0 16px}
 .nav-search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:20px;font-size:14px}
 .search-page{display:flex;gap:10px;margin:12px 0 4px;max-width:480px}
 .search-page input{flex:1}
 @media(max-width:600px){.nav-search{display:none}}
 .hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
 .contact-form{max-width:520px}
 .contact-form button{margin-top:8px}
 .sent-ok{background:#e6f5ee;color:#0d7d63;padding:12px 16px;border-radius:8px;margin:12px 0}
 .badge{background:var(--accent);color:#fff;font-size:11px;padding:1px 8px;border-radius:10px;vertical-align:middle}
</style></head>
<body data-theme="{$theme}">
<header><h1><a href="/">{$site_title}</a></h1>
<form method="get" action="/search" class="nav-search"><input type="search" name="q" placeholder="Ara…"></form>
<nav><a href="/product">Mağaza</a> &middot; <a href="/blog">Blog</a> &middot; <a href="/contact">İletişim</a> &middot; <a href="/cart">Sepet</a> &middot; <a href="/admin">Admin</a></nav></header>
<main>{#block "content"}{/block}</main>
</body></html>
