{#extends "themes/default/layout"}
{#block "content"}
<h2>Sepet <span class="muted">({$count})</span></h2>
<table>
<thead><tr><th>Ürün</th><th>Fiyat</th><th>Adet</th><th>Tutar</th><th></th></tr></thead>
<tbody>{!$rows}</tbody>
</table>
<p class="cart-total">Toplam: <b>{$total} &#8378;</b></p>
<form method="post" action="/checkout" class="checkout-fields">
  <input type="text" name="cust_name" placeholder="Ad Soyad" required>
  <input type="email" name="email" placeholder="E-posta" required>
  <input type="tel" name="phone" placeholder="Telefon">
  <textarea name="address" rows="3" placeholder="Teslimat adresi" required></textarea>
  <button>Siparişi tamamla</button>
</form>
{/block}
