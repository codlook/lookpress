{#extends "themes/default/layout"}
{#block "content"}
<h2>{$heading}</h2>
<form method="post" action="{$action}">
<label>Title <input name="title" value="{$page.title}" required></label>
<label>Slug <input name="slug" value="{$page.slug}" placeholder="about-us" required></label>
<label>Body (Markdown)<textarea name="body" rows="16">{$page.body}</textarea></label>
<label>Status
<select name="status">
<option value="draft"{$draft_sel}>draft</option>
<option value="published"{$pub_sel}>published</option>
</select></label>
<button type="submit">Save</button>
<a class="muted" href="/admin" style="margin-left:12px">Cancel</a>
</form>
{/block}
